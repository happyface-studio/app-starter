[project]
name = "deskmates-agent"
version = "0.1.0"
description = "LiveKit voice agent that sits at every Deskmates desk"
requires-python = ">=3.10,<3.14"
dependencies = [
    "livekit-agents~=1.8",
    "livekit-plugins-noise-cancellation~=0.3",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
]

[dependency-groups]
dev = ["pyright>=1.1"]

[tool.uv]
package = false

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
